# Mocks are GENERATED from the port interfaces, never hand-written.
#
# A hand-written mock drifts from its interface silently: the compiler stays
# happy because the mock still satisfies some older shape, and the test keeps
# passing against behaviour that no longer exists. Generating them means an
# interface change breaks the build until every test is updated, which is the
# point.
#
#   make mocks
#
# Unit tests mock the layer BELOW: controller tests mock services, service tests
# mock repositories (CLAUDE.md). Nothing mocks a concrete type, because no
# dependency crosses a layer boundary as one.

all: true
dir: "mocks/port"
pkgname: "mocks"
filename: "{{.InterfaceName}}.go"
structname: "{{.InterfaceName}}"

# The expecter API. A mock whose expectations are never asserted is an
# elaborate way of returning a zero value.
template: "testify"

packages:
  github.com/Manik2708/gitcherrypick/backend/internal/port:
    config:
      all: true
