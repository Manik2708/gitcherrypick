name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - uses: actions/setup-go@v5
        with:
          # Matches the go directive in backend/go.mod. Raising it silently is
          # how a dependency drags the whole project onto a newer toolchain.
          go-version: "1.24"
          cache-dependency-path: backend/go.sum

      - run: npm ci
      - run: pip install -r scripts/requirements.txt

      # Split so a failure names which check broke, rather than "make check".
      - name: formatting (prettier)
        run: npx prettier --check .

      - name: formatting (go)
        run: make go-fmt-check

      - name: go vet
        run: make go-vet

      # depguard enforces the CLAUDE.md layering here: internal/domain imports
      # nothing from internal/, and internal/port names no vendor.
      - name: lint
        run: make go-lint

      - name: go.mod is tidy
        run: make go-tidy-check

      # An ADR must not carry open questions. ADR-0008 shipped with three;
      # this is why that cannot happen twice.
      - name: RFC/ADR corpus
        run: python scripts/validate_docs.py

      - name: fixtures
        run: python scripts/validate_fixtures.py

      # -short, so this step needs neither Docker nor a database. The two jobs
      # below cover what it skips: db-test the repository suite, e2e the
      # fixtures. Between the three, every test in the tree runs.
      - name: unit tests
        run: make go-test

  # Repository tests against a real Postgres. Database only, no application: a
  # repository test that needed the API running could not tell a mapping bug
  # from a wiring bug.
  db-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum

      # The script brings up its own Postgres on 55433 and tears it down. It
      # does not collide with the e2e job, which uses 55432 and its own runner.
      - name: repository suite
        run: make db-test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum

      # Stage 3 wrote these fixtures RED and this job carried
      # continue-on-error so the branch stayed mergeable while that was the
      # open gate. Stages 4 and 5 turned all 31 green, so the exemption is
      # gone: from here a regression breaks the build, which is the whole
      # point of having written the fixtures first.
      #
      # A failure needs no log artifact. The harness prints the API's own log
      # beside the assertion that failed, and a fake server that never came up
      # prints its log as it dies.
      - name: integration suite
        run: make e2e
