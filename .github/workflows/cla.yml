name: cla

on:
  issue_comment:
    types: [created]
  # pull_request_target so the check can write a status on PRs from forks. The job never
  # checks out or runs the PR's code.
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/Manik2708/gitcherrypick/blob/main/CLA.md
          # Signatures live on their own branch so main can stay protected.
          branch: cla-signatures
          path-to-signatures: signatures/v1/cla.json
          allowlist: Manik2708,dependabot[bot],github-actions[bot]
